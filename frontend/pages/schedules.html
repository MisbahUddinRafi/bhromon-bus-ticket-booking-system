<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Available Schedules — Bhromon</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <style>
        body {
            padding: 0;
            margin: 0;
            background: #f8faf9;
            background-image: radial-gradient(ellipse at 50% 0%, rgba(132, 169, 140, 0.05) 0%, transparent 70%);
            min-height: 100vh;
            color: var(--charcoal);
            font-family: var(--font-body);
        }

        /* ── Header ── */
        header {
            background: linear-gradient(135deg, var(--dark-teal), var(--charcoal));
            color: var(--pale-sage);
            padding: 20px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
            position: sticky;
            top: 0;
            z-index: 1100;
        }

        header div:first-child {
            height: 45px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s;
        }

        header div:first-child:hover {
            transform: scale(1.05);
        }

        header div:first-child img {
            height: 100%;
            width: auto;
            object-fit: contain;
        }

        .header-buttons {
            position: relative;
        }

        .profile-btn {
            background: rgba(255, 255, 255, 0.1);
            color: var(--pale-sage);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 18px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.3s;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 14px;
        }

        .profile-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        #profileMenu {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            background: #fff;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-md);
            z-index: 10000;
            overflow: hidden;
            min-width: 180px;
            border: 1px solid rgba(82, 121, 111, 0.1);
            animation: slideInDown 0.25s var(--ease-out) both;
        }

        #profileMenu button {
            width: 100%;
            background: #fff;
            color: var(--charcoal);
            border: none;
            border-bottom: 1px solid rgba(82, 121, 111, 0.08);
            padding: 12px 20px;
            text-align: left;
            font-family: var(--font-body);
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #profileMenu button:hover {
            background: rgba(132, 169, 140, 0.1);
            color: var(--forest);
        }

        /* ── Main Container ── */
        .page-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* ── Search Bar Section ── */
        .search-bar-section {
            background: #fff;
            border-radius: var(--radius-md);
            padding: 24px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(82, 121, 111, 0.1);
            animation: fadeInDown 0.5s var(--ease-out);
        }

        .search-bar-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 20px;
            flex-wrap: wrap;
        }

        .search-input-group {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .search-input-group label {
            font-size: 12px;
            font-weight: 700;
            color: var(--forest);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .search-input-group select,
        .search-input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid rgba(82, 121, 111, 0.1);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: #fbfbfb;
            transition: all 0.3s;
        }

        .search-input-group select:focus,
        .search-input-group input:focus {
            border-color: var(--forest);
            background: #fff;
            outline: none;
            box-shadow: 0 0 0 4px rgba(82, 121, 111, 0.08);
        }

        .search-btn {
            height: 46px;
            padding: 0 30px;
            background: linear-gradient(135deg, var(--forest), var(--dark-teal));
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(82, 121, 111, 0.3);
        }

        /* ── Content Layout ── */
        .content-layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
            align-items: start;
        }

        /* ── Sidebar Filters ── */
        .filters-sidebar {
            background: #fff;
            border-radius: var(--radius-md);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(82, 121, 111, 0.1);
            position: sticky;
            top: 100px;
            max-height: calc(100vh - 140px);
            overflow-y: auto;
            animation: slideInLeft 0.5s var(--ease-out);
        }

        .filters-sidebar h3 {
            font-size: 18px;
            margin: 0 0 24px 0;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--pale-sage);
            color: var(--dark-teal);
        }

        .filter-group {
            margin-bottom: 30px;
        }

        .filter-group h4 {
            font-size: 13px;
            font-weight: 700;
            color: var(--forest);
            text-transform: uppercase;
            margin: 0 0 15px 0;
            letter-spacing: 0.5px;
        }

        .filter-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .filter-option {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 6px 0;
        }

        .filter-option input {
            accent-color: var(--forest);
            width: 17px;
            height: 17px;
        }

        .filter-option span {
            font-size: 14px;
            color: var(--charcoal);
        }

        .operator-select-btn {
            width: 100%;
            text-align: left;
            padding: 10px 15px;
            background: #f8f9f8;
            border: 1px solid rgba(82, 121, 111, 0.15);
            border-radius: var(--radius-sm);
            color: var(--charcoal);
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        #operatorDropdown {
            margin-top: 8px;
            background: #fff;
            border: 1px solid rgba(82, 121, 111, 0.1);
            border-radius: var(--radius-sm);
            max-height: 200px;
            overflow-y: auto;
            padding: 8px;
            box-shadow: var(--shadow-sm);
        }

        .selected-operators-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
        }

        .operator-chip {
            background: var(--forest);
            color: #fff;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .reset-filters-btn {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: 1.5px solid var(--forest);
            color: var(--forest);
            border-radius: var(--radius-sm);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .reset-filters-btn:hover {
            background: var(--forest);
            color: #fff;
        }

        /* ── Schedules Area ── */
        .schedules-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .schedules-header h3 {
            margin: 0;
            font-size: 22px;
            color: var(--charcoal);
        }

        .results-count {
            font-size: 13px;
            color: var(--forest);
            font-weight: 700;
            background: rgba(132, 169, 140, 0.12);
            padding: 5px 15px;
            border-radius: 30px;
        }

        #scheduleContainer {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        /* ── Cards ── */
        .schedule-card {
            background: #fff;
            border-radius: var(--radius-md);
            border: 1px solid rgba(82, 121, 111, 0.1);
            box-shadow: var(--shadow-sm);
            transition: all 0.3s;
        }

        .schedule-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            border-color: var(--sage);
        }

        .card-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
            gap: 20px;
        }

        .operator-meta {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .operator-branding {
            min-width: 180px;
        }

        .operator-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--dark-teal);
            margin: 0 0 5px 0;
        }

        .bus-type-badge {
            display: inline-block;
            padding: 2px 8px;
            background: var(--pale-sage);
            color: var(--dark-teal);
            border-radius: 4px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .route-path {
            font-size: 12px;
            font-weight: 700;
            color: var(--forest);
            letter-spacing: 0.3px;
            opacity: 0.85;
            white-space: nowrap;
        }

        .journey-info {
            display: flex;
            gap: 40px;
        }

        .info-block {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .info-label {
            font-size: 10px;
            font-weight: 700;
            color: var(--sage);
            text-transform: uppercase;
        }

        .info-value {
            font-size: 15px;
            font-weight: 600;
            color: var(--charcoal);
        }

        .low-seats {
            color: #e74c3c;
        }

        .card-action {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
            padding-left: 30px;
            border-left: 1px solid rgba(82, 121, 111, 0.1);
            min-width: 160px;
        }

        .price-tag {
            display: flex;
            align-items: baseline;
            gap: 2px;
        }

        .currency {
            font-size: 14px;
            font-weight: 700;
            color: var(--forest);
        }

        .amount {
            font-size: 26px;
            font-weight: 800;
            color: var(--dark-teal);
            font-family: var(--font-display);
        }

        .book-now-btn {
            width: 100%;
            padding: 12px 0;
            background: linear-gradient(135deg, var(--forest), var(--dark-teal));
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .book-now-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(82, 121, 111, 0.3);
        }

        /* ── Animation & Utilities ── */
        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.5s var(--ease-out) both;
        }

        @media (max-width: 992px) {
            .content-layout {
                grid-template-columns: 1fr;
            }

            .filters-sidebar {
                position: relative;
                top: 0;
                max-height: none;
                margin-bottom: 30px;
            }
        }

        @media (max-width: 768px) {
            .card-main {
                flex-direction: column;
                align-items: flex-start;
            }

            .operator-meta {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }

            .card-action {
                border-left: none;
                border-top: 1px solid #eee;
                padding: 20px 0 0 0;
                width: 100%;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }

            .book-now-btn {
                width: auto;
                padding: 10px 30px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div onclick="goDashboard()">
            <img src="../../docs/bhromon_logo.png" alt="bhromon">
        </div>

        <div class="header-buttons">
            <button class="profile-btn" onclick="toggleProfile()">Profile ▼</button>
            <div id="profileMenu" style="display:none;">
                <button onclick="goToProfile()">My Profile</button>
                <button onclick="logout()">Logout</button>
            </div>
        </div>
    </header>

    <div class="page-container">
        <!-- SEARCH AGAIN SECTION -->
        <section class="search-bar-section">
            <div class="search-bar-wrapper">
                <div class="search-input-group">
                    <label>From</label>
                    <select id="fromCity"></select>
                </div>
                <div class="search-input-group">
                    <label>To</label>
                    <select id="toCity"></select>
                </div>
                <div class="search-input-group">
                    <label>Journey Date</label>
                    <input type="date" id="journeyDate">
                </div>
                <button class="search-btn" onclick="searchAgain()">
                    Modify Search
                </button>
            </div>
        </section>

        <div class="content-layout">
            <!-- LEFT SIDEBAR: FILTERS -->
            <aside class="filters-sidebar">
                <h3>⚙️ Filtering</h3>

                <div class="filter-group">
                    <h4>Sort By</h4>
                    <div class="filter-options">
                        <label class="filter-option">
                            <input type="radio" name="sortOption" id="sortPriceLow" value="price-low" checked>
                            <span>Price: Low to High</span>
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="sortOption" id="sortPriceHigh" value="price-high">
                            <span>Price: High to Low</span>
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="sortOption" id="sortTimeEarly" value="time-early">
                            <span>Departure: Early-Late</span>
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="sortOption" id="sortTimeLate" value="time-late">
                            <span>Departure: Late-Early</span>
                        </label>
                    </div>
                </div>

                <div class="filter-group">
                    <h4>Bus Type</h4>
                    <div class="filter-options">
                        <label class="filter-option">
                            <input type="checkbox" name="busType" value="ac">
                            <span>AC Services</span>
                        </label>
                        <label class="filter-option">
                            <input type="checkbox" name="busType" value="non-ac">
                            <span>Non-AC Services</span>
                        </label>
                    </div>
                </div>

                <div class="filter-group">
                    <h4>Operators</h4>
                    <button class="operator-select-btn" onclick="toggleOperatorDropdown()">
                        Select Operators <span>▼</span>
                    </button>
                    <div id="operatorDropdown" style="display:none;"></div>
                    <div id="selectedOperators" class="selected-operators-list"></div>
                    <div id="noOperatorsMsg" style="display:none; font-size: 11px; color: #999; margin-top: 8px;">
                        Showing all operators
                    </div>
                </div>

                <button class="reset-filters-btn" onclick="resetFilters()">🔄 Reset Filters</button>
            </aside>

            <!-- RIGHT SIDE: SCHEDULE CARDS -->
            <main class="schedules-main">
                <div class="schedules-header">
                    <h3>🚌 Schedules <span id="resultsCount" class="results-count"></span></h3>
                </div>

                <div id="scheduleContainer"></div>

                <div id="noSchedulesMsg" style="display:none; text-align: center; padding: 60px; color: #999;">
                    <div style="font-size: 40px; margin-bottom: 20px;">🎫</div>
                    <p>No results found for your filters.</p>
                    <button class="btn btn-secondary" onclick="resetFilters()" style="margin-top: 15px;">Clear
                        Filters</button>
                </div>
            </main>
        </div>
    </div>

    <script src="../js/alerts.js"></script>
    <script src="../js/schedules.js"></script>
    <script src="../js/booking.js"></script>

</body>

</html>
