<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger Details — Bhromon</title>
    <meta name="description"
        content="Enter passenger details and contact information to complete your bus ticket booking on Bhromon.">
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        /* ── Body ── */
        body {
            padding-top: 80px;
            background: var(--charcoal);
            background-image:
                radial-gradient(ellipse at 15% 40%, rgba(82, 121, 111, 0.12) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 70%, rgba(53, 79, 82, 0.1) 0%, transparent 50%);
            min-height: 100vh;
            color: var(--text-primary);
        }

        /* ── Header ── */
        header {
            background: linear-gradient(135deg, var(--dark-teal), var(--charcoal));
            color: var(--pale-sage);
            padding: 20px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            animation: slideInDown 0.5s var(--ease-out) both;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1001;
            border-bottom: 1px solid rgba(132, 169, 140, 0.15);
        }

        header div:first-child {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s var(--ease-out);
            height: 50px;
            max-width: 180px;
        }

        header div:first-child img {
            height: 100%;
            width: auto;
            max-width: 150px;
            object-fit: contain;
            display: block;
        }

        header div:first-child:hover {
            opacity: 0.8;
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            header div:first-child {
                height: 40px;
                max-width: 140px;
                gap: 8px;
            }

            header div:first-child img {
                max-width: 120px;
            }
        }

        @media (max-width: 480px) {
            header div:first-child {
                height: 35px;
                max-width: 110px;
                gap: 6px;
            }

            header div:first-child img {
                max-width: 90px;
            }
        }

        .header-buttons {
            position: relative;
            z-index: 1000;
        }

        header button {
            background: rgba(255, 255, 255, 0.1);
            color: var(--pale-sage);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.3s var(--ease-out);
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 14px;
        }

        header button:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.3);
        }

        #profileMenu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: #fff;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-md);
            z-index: 10000;
            overflow: hidden;
            min-width: 190px;
            border: 1px solid rgba(82, 121, 111, 0.1);
            animation: slideInDown 0.25s var(--ease-out) both;
        }

        #profileMenu button {
            width: 100%;
            background: #fff;
            color: var(--charcoal);
            border: none;
            border-bottom: 1px solid rgba(82, 121, 111, 0.08);
            border-radius: 0;
            padding: 13px 20px;
            text-align: left;
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 500;
        }

        #profileMenu button:last-child {
            border-bottom: none;
        }

        #profileMenu button:hover {
            background: rgba(132, 169, 140, 0.08);
            color: var(--forest);
        }

        .profile-btn {
            background: rgba(255, 255, 255, 0.1);
            color: var(--pale-sage);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.3s var(--ease-out);
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 14px;
        }

        .profile-btn:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        /* ── Progress Steps ── */
        .progress-bar-wrap {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px 20px 0;
            animation: fadeInUp 0.4s var(--ease-out) both;
        }

        .progress-steps {
            display: flex;
            align-items: center;
            gap: 0;
            margin-bottom: 6px;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .step-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            font-family: var(--font-display);
            flex-shrink: 0;
            border: 2px solid rgba(132, 169, 140, 0.3);
            background: rgba(202, 210, 197, 0.06);
            color: var(--text-muted);
            transition: all 0.3s;
        }

        .step.done .step-dot {
            background: var(--forest);
            border-color: var(--forest);
            color: var(--pale-sage);
        }

        .step.active .step-dot {
            background: linear-gradient(135deg, var(--sage), var(--forest));
            border-color: var(--sage);
            color: #fff;
            box-shadow: 0 0 0 4px rgba(132, 169, 140, 0.2);
        }

        .step-label {
            font-size: 13px;
            font-weight: 500;
            font-family: var(--font-display);
            color: var(--text-muted);
        }

        .step.done .step-label {
            color: var(--sage);
        }

        .step.active .step-label {
            color: var(--pale-sage);
            font-weight: 600;
        }

        .step-connector {
            flex: 1;
            height: 2px;
            background: rgba(132, 169, 140, 0.2);
            margin: 0 8px;
        }

        .step-connector.done {
            background: var(--forest);
        }

        /* ── Page Container ── */
        .passenger-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .passenger-main {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 24px;
            margin-top: 16px;
        }

        /* ── Left Panel ── */
        .passenger-left {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ── Cards ── */
        .pi-card {
            background: #fff;
            border: 1px solid rgba(82, 121, 111, 0.1);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            animation: fadeInUp 0.5s var(--ease-out) both;
        }

        .pi-card:nth-child(2) {
            animation-delay: 0.08s;
        }

        .pi-card-header {
            background: linear-gradient(135deg, var(--dark-teal), var(--forest));
            padding: 18px 28px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .pi-card-header .card-icon {
            width: 36px;
            height: 36px;
            background: rgba(202, 210, 197, 0.15);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .pi-card-header h3 {
            font-size: 17px;
            font-weight: 600;
            color: var(--pale-sage);
            margin: 0;
            font-family: var(--font-display);
        }

        .pi-card-body {
            padding: 28px;
        }

        /* ── Form Groups ── */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--charcoal);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            font-family: var(--font-display);
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid rgba(82, 121, 111, 0.2);
            border-radius: var(--radius-sm);
            background: #fff;
            color: var(--charcoal);
            font-size: 14px;
            font-family: var(--font-body);
            transition: all 0.3s var(--ease-out);
            outline: none;
        }

        .form-group input::placeholder {
            color: rgba(47, 62, 70, 0.38);
        }

        .form-group input:focus {
            border-color: var(--forest);
            box-shadow: 0 0 0 4px rgba(82, 121, 111, 0.1);
        }

        .form-group input.error {
            border-color: #c0392b;
            box-shadow: 0 0 0 4px rgba(192, 57, 43, 0.1);
        }

        .error-message {
            font-size: 12px;
            color: #e74c3c;
            margin-top: 6px;
            display: none;
            font-family: var(--font-body);
        }

        .error-message.show {
            display: block;
        }

        /* ── Passenger Items ── */
        .passenger-item {
            background: rgba(82, 121, 111, 0.03);
            border: 1.5px solid rgba(82, 121, 111, 0.12);
            border-radius: var(--radius-sm);
            padding: 22px;
            margin-bottom: 16px;
            transition: border-color 0.3s;
        }

        .passenger-item:last-child {
            margin-bottom: 0;
        }

        .passenger-item:hover {
            border-color: rgba(82, 121, 111, 0.25);
        }

        .passenger-seat-number {
            font-size: 11px;
            font-weight: 700;
            color: var(--forest);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 16px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(82, 121, 111, 0.08);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(82, 121, 111, 0.15);
        }

        .passenger-form-group {
            margin-bottom: 14px;
        }

        .passenger-form-group:last-child {
            margin-bottom: 0;
        }

        .passenger-form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--charcoal);
            margin-bottom: 6px;
            font-family: var(--font-display);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .passenger-form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid rgba(82, 121, 111, 0.2);
            border-radius: var(--radius-sm);
            background: #fff;
            color: var(--charcoal);
            font-size: 13px;
            font-family: var(--font-body);
            transition: all 0.3s var(--ease-out);
            outline: none;
        }

        .passenger-form-group input::placeholder {
            color: rgba(47, 62, 70, 0.38);
        }

        .passenger-form-group input:focus {
            border-color: var(--forest);
            box-shadow: 0 0 0 3px rgba(82, 121, 111, 0.1);
        }

        .passenger-form-group input.error {
            border-color: #c0392b;
        }

        /* ── Gender Selector ── */
        .gender-options {
            display: flex;
            gap: 10px;
            margin-top: 0;
        }

        .gender-option {
            flex: 1;
        }

        .gender-option input[type="radio"] {
            display: none;
        }

        .gender-option label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 10px;
            border: 1.5px solid rgba(82, 121, 111, 0.2);
            border-radius: var(--radius-sm);
            background: #fff;
            color: rgba(47, 62, 70, 0.65);
            cursor: pointer;
            transition: all 0.3s var(--ease-out);
            font-size: 13px;
            font-weight: 500;
            font-family: var(--font-body);
            text-transform: none;
            letter-spacing: 0;
        }

        .gender-option label:hover {
            border-color: var(--sage);
            color: var(--forest);
            background: rgba(132, 169, 140, 0.05);
        }

        .gender-option input[type="radio"]:checked+label {
            background: rgba(82, 121, 111, 0.1);
            border-color: var(--forest);
            color: var(--forest);
            font-weight: 600;
        }

        /* ── Right Panel: Summary ── */
        .passenger-right {
            position: sticky;
            top: 100px;
            height: fit-content;
            animation: fadeInUp 0.5s 0.12s var(--ease-out) both;
        }

        .schedule-details-card {
            background: #fff;
            border: 1px solid rgba(82, 121, 111, 0.1);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .schedule-details-card .sdc-header {
            background: linear-gradient(135deg, var(--charcoal), var(--dark-teal));
            padding: 18px 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sdc-header .card-icon {
            font-size: 20px;
        }

        .sdc-header h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: var(--pale-sage);
            font-family: var(--font-display);
        }

        .sdc-body {
            padding: 22px;
        }

        .schedule-detail-item {
            margin-bottom: 14px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(82, 121, 111, 0.08);
        }

        .schedule-detail-item:last-of-type {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .detail-label {
            font-size: 10px;
            font-weight: 700;
            color: var(--forest);
            text-transform: uppercase;
            letter-spacing: 0.9px;
            margin-bottom: 4px;
            font-family: var(--font-display);
        }

        .detail-value {
            font-size: 14px;
            color: var(--charcoal);
            font-weight: 500;
            font-family: var(--font-body);
        }

        .separator {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(82, 121, 111, 0.2), transparent);
            margin: 6px 0 16px;
        }

        .total-fare-row {
            background: rgba(82, 121, 111, 0.05);
            border: 1.5px solid rgba(82, 121, 111, 0.15);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }

        .total-fare-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--charcoal);
            text-transform: uppercase;
            letter-spacing: 0.7px;
            font-family: var(--font-display);
        }

        .total-fare {
            font-size: 20px;
            font-weight: 800;
            color: var(--forest);
            font-family: var(--font-display);
        }

        /* ── Action Buttons ── */
        .button-group {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-proceed {
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, var(--forest), var(--dark-teal));
            color: var(--pale-sage);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 700;
            font-family: var(--font-display);
            cursor: pointer;
            transition: all 0.3s var(--ease-out);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            box-shadow: 0 4px 16px rgba(82, 121, 111, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn-proceed::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.08), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s;
        }

        .btn-proceed:hover::after {
            transform: translateX(100%);
        }

        .btn-proceed:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(82, 121, 111, 0.4);
        }

        .btn-proceed:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-back {
            width: 100%;
            padding: 12px 24px;
            background: transparent;
            color: var(--charcoal);
            border: 1.5px solid rgba(82, 121, 111, 0.25);
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            font-family: var(--font-display);
            cursor: pointer;
            transition: all 0.3s var(--ease-out);
            letter-spacing: 0.3px;
        }

        .btn-back:hover {
            border-color: var(--sage);
            background: rgba(132, 169, 140, 0.06);
            color: var(--forest);
        }

        /* ── Responsive ── */
        @media (max-width: 1024px) {
            .passenger-main {
                grid-template-columns: 1fr;
            }

            .passenger-right {
                position: static;
            }
        }

        @media (max-width: 768px) {
            .passenger-container {
                padding: 16px;
            }

            .passenger-main {
                gap: 16px;
                margin-top: 12px;
            }

            .pi-card-body {
                padding: 20px;
            }

            .pi-card-header {
                padding: 15px 20px;
            }

            .sdc-body {
                padding: 18px;
            }

            .progress-bar-wrap {
                padding: 16px 16px 0;
            }

            .step-label {
                font-size: 11px;
            }
        }

        @media (max-width: 480px) {
            .button-group {
                flex-direction: column-reverse;
            }

            .progress-steps {
                gap: 0;
            }

            .step-label {
                display: none;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header>
        <div onclick="goDashboard()" style="cursor:pointer;">
            <img src="../../docs/bhromon_logo.png" alt="bhromon">
        </div>

        <div class="header-buttons">
            <button class="profile-btn" onclick="toggleProfile()">Profile ▼</button>
            <div id="profileMenu" style="display:none;">
                <button onclick="goToProfile()">My Profile</button>
                <button onclick="logout()">Logout</button>
            </div>
        </div>
    </header>

    <!-- Booking Progress -->
    <div class="progress-bar-wrap">
        <div class="progress-steps">
            <div class="step done">
                <div class="step-dot">✓</div>
                <span class="step-label">Search</span>
            </div>
            <div class="step-connector done"></div>
            <div class="step done">
                <div class="step-dot">✓</div>
                <span class="step-label">Seat Selection</span>
            </div>
            <div class="step-connector done"></div>
            <div class="step active">
                <div class="step-dot">3</div>
                <span class="step-label">Passenger Info</span>
            </div>
            <div class="step-connector"></div>
            <div class="step">
                <div class="step-dot">4</div>
                <span class="step-label">Payment</span>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="passenger-container">
        <div class="passenger-main">

            <!-- Left Side: Contact Info & Passenger Details -->
            <div class="passenger-left">

                <!-- Contact Information Card -->
                <div class="pi-card">
                    <div class="pi-card-header">
                        <div class="card-icon">📞</div>
                        <h3>Contact Information</h3>
                    </div>
                    <div class="pi-card-body">
                        <div class="form-group">
                            <label for="contactPhone">Phone Number</label>
                            <input type="text" id="contactPhone" placeholder="01700000000 or +8801700000000" />
                            <div class="error-message"></div>
                        </div>
                        <div class="form-group">
                            <label for="contactEmail">Email Address</label>
                            <input type="email" id="contactEmail" placeholder="example@email.com" />
                            <div class="error-message"></div>
                        </div>
                    </div>
                </div>

                <!-- Passenger Details Card -->
                <div class="pi-card">
                    <div class="pi-card-header">
                        <div class="card-icon">🧳</div>
                        <h3>Passenger Details</h3>
                    </div>
                    <div class="pi-card-body">
                        <div id="passengersContainer">
                            <!-- Passenger items will be inserted here by JavaScript -->
                        </div>
                    </div>
                </div>

            </div>

            <!-- Right Side: Journey Summary -->
            <div class="passenger-right">
                <div class="schedule-details-card">
                    <div class="sdc-header">
                        <div class="card-icon">🚌</div>
                        <h3>Journey Summary</h3>
                    </div>
                    <div class="sdc-body">

                        <div class="schedule-detail-item">
                            <div class="detail-label">Operator</div>
                            <div class="detail-value" id="detailOperator">—</div>
                        </div>

                        <div class="schedule-detail-item">
                            <div class="detail-label">Route</div>
                            <div class="detail-value" id="detailRoute">—</div>
                        </div>

                        <div class="schedule-detail-item">
                            <div class="detail-label">Date</div>
                            <div class="detail-value" id="detailDate">—</div>
                        </div>

                        <div class="schedule-detail-item">
                            <div class="detail-label">Departure Time</div>
                            <div class="detail-value" id="detailTime">—</div>
                        </div>

                        <div class="separator"></div>

                        <div class="schedule-detail-item">
                            <div class="detail-label">Selected Seats</div>
                            <div class="detail-value" id="detailSeats">—</div>
                        </div>

                        <div class="schedule-detail-item">
                            <div class="detail-label">Per Seat Cost</div>
                            <div class="detail-value" id="detailPrice">—</div>
                        </div>

                        <div class="total-fare-row">
                            <span class="total-fare-label">Total Fare</span>
                            <span class="total-fare" id="detailTotalFare">৳0.00</span>
                        </div>

                        <div class="button-group">
                            <button class="btn-proceed" id="proceedPaymentBtn" onclick="proceedToPayment()">
                                Proceed to Payment →
                            </button>
                            <button class="btn-back" onclick="goBackToSchedules()">
                                ← Back to Schedules
                            </button>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="../js/alerts.js"></script>
    <script src="../js/passengerInfo.js"></script>
</body>

</html>
